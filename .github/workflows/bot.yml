
on:
  schedule:
    - cron: "*/5 * * * *"   # yaklaşık 5 dakikada bir bekleyen mesajlara cevap verir
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telegram-bot
  cancel-in-progress: false

jobs:
  cevapla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Mesajlara cevap ver
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python telegram_bot.py --once
      - name: Okunan mesaj sırasını kaydet
        run: |
          git config user.name "ilan-bot"
          git config user.email "ilan-bot@users.noreply.github.com"
          git add bot_offset.json || true
          git diff --cached --quiet || (git commit -m "bot offset" && git pull --rebase && git push)
